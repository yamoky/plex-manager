<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plex Manager</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #141414; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #e50914; margin-bottom: 20px; }
    
    .card-box { background: #1f1f1f; padding: 25px; border-radius: 8px; max-width: 400px; margin: 0 auto; border: 1px solid #333; text-align: center; }
    .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
    input { padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; width: 100%; text-align: center; }
    
    .btn-red { padding: 12px 20px; background: #e50914; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
    .btn-red:hover { background: #f40612; }
    .btn-secondary { background: #333; color: #aaa; margin-top: 10px; font-size: 13px; }

    #app-section { display: none; max-width: 900px; margin: 0 auto; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; border: 1px solid #333; }
    .search-container { display: flex; justify-content: center; gap: 10px; max-width: 500px; margin: 0 auto 20px auto; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #1f1f1f; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2a2a2a; }
    .card img { width: 100%; height: 230px; object-fit: cover; background: #111; }
    .card-content { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: center; }
    .card h3 { font-size: 13px; margin: 0; line-height: 1.3; }
    .status { text-align: center; font-size: 14px; margin: 15px 0; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>Plex Manager</h1>
  
  <!-- ECRAN DE CONNEXION -->
  <div id="login-section" class="card-box">
    <h3 style="margin-top:0;">Connexion Sécurisée</h3>
    <div class="input-group">
      <input type="text" id="username" placeholder="Identifiant">
      <input type="password" id="password" placeholder="Mot de passe">
    </div>
    <button class="btn-red" onclick="handleLogin()">Se connecter</button>
    <div id="login-error" style="color:#f44336; font-size:13px; margin-top:12px; font-weight:bold;"></div>
  </div>

  <!-- ECRAN DE RECHERCHE -->
  <div id="app-section">
    <div class="user-bar">
      <span>Session ouverte : <strong id="logged-user" style="color:#4caf50;"></strong></span>
      <button class="btn-red btn-secondary" style="width:auto; padding:6px 12px;" onclick="handleLogout()">Déconnexion</button>
    </div>

    <div class="search-container">
      <input type="text" id="query" placeholder="Rechercher un film..." onkeypress="if(event.key==='Enter') searchMovie()">
      <button class="btn-red" style="width:auto;" onclick="searchMovie()">Chercher</button>
    </div>

    <div id="status" class="status"></div>
    <div id="results" class="grid"></div>
  </div>

  <script>
    const TMDB_API_KEY = "3fd2be6f0c70a2a598f084dd92ef0778";

    window.onload = function() {
      const savedUser = localStorage.getItem('plex_user');
      const savedPass = localStorage.getItem('plex_pass');
      if (savedUser && savedPass) {
        showApp(savedUser);
      }
    };

    function handleLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const errDiv = document.getElementById('login-error');

      if (!u || !p) {
        errDiv.innerText = "Veuillez remplir l'identifiant et le mot de passe.";
        return;
      }

      localStorage.setItem('plex_user', u);
      localStorage.setItem('plex_pass', p);
      errDiv.innerText = "";
      showApp(u);
    }

    function handleLogout() {
      localStorage.removeItem('plex_user');
      localStorage.removeItem('plex_pass');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('app-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
    }

    function showApp(username) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('logged-user').innerText = username;
      document.getElementById('app-section').style.display = 'block';
    }

    async function hashSHA256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function searchMovie() {
      const q = document.getElementById('query').value.trim();
      const statusDiv = document.getElementById('status');
      const grid = document.getElementById('results');
      
      if (!q) {
        statusDiv.style.color = '#ff9800';
        statusDiv.innerText = "Veuillez entrer le nom d'un film.";
        return;
      }

      statusDiv.style.color = '#aaa';
      statusDiv.innerText = "Recherche en cours...";
      grid.innerHTML = '';

      try {
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(q)}&language=fr-FR&include_adult=false`;
        const res = await fetch(url);
        
        if (!res.ok) {
          throw new Error("Erreur réponse API");
        }
        
        const data = await res.json();

        if (!data.results || data.results.length === 0) {
          statusDiv.style.color = '#ff9800';
          statusDiv.innerText = "Aucun film trouvé avec ce titre.";
          return;
        }

        statusDiv.innerText = "";
        data.results.slice(0, 10).forEach(m => {
          const poster = m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://via.placeholder.com/500x750?text=Pas+d+image';
          const year = m.release_date ? m.release_date.split('-')[0] : 'Inconnue';
          const cleanTitle = m.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
          
          grid.innerHTML += `
            <div class="card">
              <img src="${poster}" alt="${m.title}">
              <div class="card-content">
                <h3>${m.title} (${year})</h3>
                <button class="btn-red" onclick="requestMovie('${cleanTitle}', '${year}')">Ajouter</button>
              </div>
            </div>
          `;
        });
      } catch (e) {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "Erreur de connexion à la base de films TMDB.";
      }
    }

    async function requestMovie(title, year) {
      const user = localStorage.getItem('plex_user');
      const pass = localStorage.getItem('plex_pass');
      const statusDiv = document.getElementById('status');

      statusDiv.style.color = '#ff9800';
      statusDiv.innerText = `Envoi de la demande pour "${title}"...`;

      const passHash = await hashSHA256(pass);

      try {
        const response = await fetch('https://api.github.com/repos/yamoky/plex-manager/dispatches', {
          method: 'POST',
          headers: { 
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'download_movie',
            client_payload: { 
              title: title, 
              year: year,
              user: user,
              pass_hash: passHash 
            }
          })
        });

        if (response.ok || response.status === 204) {
          statusDiv.style.color = '#4caf50';
          statusDiv.innerText = `Demande transmise avec succès pour "${title}" !`;
        } else {
          statusDiv.style.color = '#f44336';
          statusDiv.innerText = "Erreur d'envoi. Vérifiez la configuration du dépôt.";
        }
      } catch (err) {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "Erreur réseau lors de l'envoi.";
      }
    }
  </script>
</body>
</html>
