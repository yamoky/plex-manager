<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plex Manager</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #141414; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #e50914; margin-bottom: 10px; }
    .auth-container { background: #1f1f1f; padding: 15px; border-radius: 8px; max-width: 400px; margin: 0 auto 20px auto; border: 1px solid #333; }
    .auth-container h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; text-align: center; }
    .auth-group { display: flex; flex-direction: column; gap: 10px; }
    .auth-status { font-size: 12px; text-align: center; margin-top: 8px; font-weight: bold; }
    .search-container { display: flex; justify-content: center; gap: 10px; max-width: 500px; margin: 0 auto 20px auto; }
    input { padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; width: 100%; }
    button { padding: 12px 20px; background: #e50914; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    button:hover { background: #f40612; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
    .card { background: #1f1f1f; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2a2a2a; }
    .card img { width: 100%; height: 210px; object-fit: cover; background: #111; }
    .card-content { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .card h3 { font-size: 13px; margin: 0; line-height: 1.3; }
    .status { text-align: center; font-size: 14px; margin: 15px 0; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>Plex Manager</h1>
  
  <div class="auth-container">
    <h3>Connexion Sécurisée</h3>
    <div class="auth-group">
      <input type="text" id="username" placeholder="Identifiant" oninput="updateAuth()">
      <input type="password" id="password" placeholder="Mot de passe" oninput="updateAuth()">
    </div>
    <div id="auth-status" class="auth-status"></div>
  </div>

  <div class="search-container">
    <input type="text" id="query" placeholder="Rechercher un film..." onkeypress="if(event.key==='Enter') searchMovie()">
    <button onclick="searchMovie()">Chercher</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results" class="grid"></div>

  <script>
    const TMDB_API_KEY = "15d2ce10022386a24823843b37b41c94";
    
    document.getElementById('username').value = localStorage.getItem('plex_user') || '';
    document.getElementById('password').value = localStorage.getItem('plex_pass') || '';
    updateAuth();

    function updateAuth() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      localStorage.setItem('plex_user', u);
      localStorage.setItem('plex_pass', p);

      const statusEl = document.getElementById('auth-status');
      if (u && p) {
        statusEl.style.color = '#4caf50';
        statusEl.innerText = `Connecté en tant que : ${u}`;
      } else {
        statusEl.style.color = '#ff9800';
        statusEl.innerText = "Saisissez votre identifiant et mot de passe";
      }
    }

    async function hashSHA256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function searchMovie() {
      const q = document.getElementById('query').value.trim();
      const statusDiv = document.getElementById('status');
      const grid = document.getElementById('results');
      
      if (!q) {
        statusDiv.style.color = '#ff9800';
        statusDiv.innerText = "Veuillez entrer le nom d'un film.";
        return;
      }

      statusDiv.style.color = '#aaa';
      statusDiv.innerText = "Recherche en cours...";
      grid.innerHTML = '';

      try {
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(q)}&language=fr-FR&include_adult=false`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.results || data.results.length === 0) {
          statusDiv.style.color = '#ff9800';
          statusDiv.innerText = "Aucun film trouvé avec ce titre.";
          return;
        }

        statusDiv.innerText = "";
        data.results.slice(0, 8).forEach(m => {
          const poster = m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://via.placeholder.com/500x750?text=Pas+d+image';
          const year = m.release_date ? m.release_date.split('-')[0] : 'Année inconnue';
          const cleanTitle = m.title.replace(/'/g, "\\'");
          
          grid.innerHTML += `
            <div class="card">
              <img src="${poster}" alt="${m.title}">
              <div class="card-content">
                <h3>${m.title} (${year})</h3>
                <button onclick="requestMovie('${cleanTitle}', '${year}')">Ajouter</button>
              </div>
            </div>
          `;
        });
      } catch (e) {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "Erreur de connexion à la base de films.";
      }
    }

    async function requestMovie(title, year) {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const statusDiv = document.getElementById('status');

      if (!user || !pass) {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "Veuillez saisir votre identifiant et mot de passe.";
        return;
      }

      statusDiv.style.color = '#ff9800';
      statusDiv.innerText = `Chiffrement et envoi de la demande pour "${title}"...`;

      const passHash = await hashSHA256(pass);

      try {
        const response = await fetch('https://api.github.com/repos/yamoky/plex-manager/dispatches', {
          method: 'POST',
          headers: { 
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'download_movie',
            client_payload: { 
              title: title, 
              year: year,
              user: user,
              pass_hash: passHash 
            }
          })
        });

        if (response.ok || response.status === 204) {
          statusDiv.style.color = '#4caf50';
          statusDiv.innerText = `Demande transmise avec succès pour "${title}" ! Le serveur traite le téléchargement.`;
        } else {
          statusDiv.style.color = '#f44336';
          statusDiv.innerText = "Erreur d'envoi. Vérifiez la configuration du dépôt.";
        }
      } catch (err) {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "Erreur réseau lors de l'envoi.";
      }
    }
  </script>
</body>
</html>
