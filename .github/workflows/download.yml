name: Plex Download Processing

on:
  repository_dispatch:
    types:
      - download_movie

jobs:
  process-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Search C411 and send to AllDebrid
        env:
          INPUT_USER: ${{ github.event.client_payload.user }}
          INPUT_PASS_HASH: ${{ github.event.client_payload.pass_hash }}

          VALID_USER: ${{ secrets.APP_USER }}
          VALID_PASS: ${{ secrets.APP_PASSWORD }}

          C411_TOKEN: ${{ secrets.C411_API_TOKEN }}
          ALLDEBRID_KEY: ${{ secrets.ALLDEBRID_API_KEY }}

          MOVIE_TITLE: ${{ github.event.client_payload.title }}
          MOVIE_YEAR: ${{ github.event.client_payload.year }}

        run: |
          python << 'EOF'

          import hashlib
          import os
          import re
          import sys

          import requests


          ##########################################################
          # Authentification
          ##########################################################

          print("🔐 Vérification de l'authentification...")

          valid_user = os.environ["VALID_USER"]
          valid_pass = os.environ["VALID_PASS"]

          input_user = os.environ.get("INPUT_USER", "")
          input_hash = os.environ.get("INPUT_PASS_HASH", "")

          expected_hash = hashlib.sha256(
              valid_pass.encode("utf-8")
          ).hexdigest()

          if (
              input_user != valid_user
              or input_hash.lower() != expected_hash.lower()
          ):
              print("❌ Authentification refusée.")
              sys.exit(1)

          print("✅ Authentification validée")


          ##########################################################
          # Variables
          ##########################################################

          c411_token = os.environ["C411_TOKEN"]
          alldebrid_key = os.environ["ALLDEBRID_KEY"]

          title = os.environ.get("MOVIE_TITLE", "")
          year = os.environ.get("MOVIE_YEAR", "")

          clean_title = re.sub(r"[\'’\.\,\-\_\:\!\?]", " ", title)
          clean_title = " ".join(clean_title.split())

          search_query = f"{clean_title} {year}".strip()

          print()
          print(f"🎬 Film : {title}")
          print(f"🔍 Recherche : {search_query}")
          print()


          ##########################################################
          # Recherche C411
          ##########################################################

          headers = {
              "Authorization": f"Bearer {c411_token}"
          }

          def search(query):

              print(f"Recherche C411 : {query}")

              r = requests.get(
                  "https://c411.org/api/torrents",
                  headers=headers,
                  params={"q": query},
                  timeout=30
              )

              print("Code HTTP :", r.status_code)

              if r.status_code != 200:
                  print(r.text)
                  sys.exit(1)

              try:
                  data = r.json()
              except Exception:
                  print("Réponse non JSON :")
                  print(r.text)
                  sys.exit(1)

              if isinstance(data, dict):
                  return data.get("results", [])

              if isinstance(data, list):
                  return data

              return []


          results = search(search_query)

          if not results and year:
              print()
              print("Aucun résultat avec l'année.")
              print("Nouvelle tentative...")
              print()

              results = search(clean_title)

          if not results:
              print("❌ Aucun torrent trouvé.")
              sys.exit(0)

          torrent = results[0]

          print()
          print("✅ Torrent trouvé")
          print(torrent.get("name"))
          print()


          ##########################################################
          # Magnet
          ##########################################################

          magnet = (
              torrent.get("magnet")
              or torrent.get("download_url")
              or torrent.get("link")
          )

          if not magnet:
              print("❌ Aucun lien magnet.")
              sys.exit(1)


          ##########################################################
          # Envoi AllDebrid
          ##########################################################

          print("🚀 Envoi vers AllDebrid...")

          params = {
              "agent": "PlexManager",
              "apikey": alldebrid_key,
              "magnets[]": magnet
          }

          response = requests.get(
              "https://api.alldebrid.com/v4/magnet/upload",
              params=params,
              timeout=30
          )

          print("HTTP :", response.status_code)

          try:
              result = response.json()
          except Exception:
              print(response.text)
              sys.exit(1)

          print()
          print("Réponse AllDebrid :")
          print(result)
          print()

          if result.get("status") != "success":
              print("❌ Erreur AllDebrid")
              sys.exit(1)

          print("🎉 Torrent envoyé avec succès !")

          EOF
